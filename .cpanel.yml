---
deployment:
  tasks:

    # ============================================================
    # 1. Deployment paths
    # ============================================================

    - export PUBLIC_HTML=/home/click2itbd/public_html
    - export BACKEND_DIR=/home/click2itbd/backend_app


    # ============================================================
    # 2. Create required directories
    # ============================================================

    - /bin/mkdir -p $PUBLIC_HTML
    - /bin/mkdir -p $BACKEND_DIR


    # ============================================================
    # 3. Deploy React/Vite Frontend
    #
    # dist/ is already the production build.
    # Only compiled frontend files are copied to public_html.
    # ============================================================

    - /bin/cp -R dist/. $PUBLIC_HTML/


    # ============================================================
    # 4. Deploy Backend
    #
    # Backend source is kept outside public_html.
    # This prevents backend source files from being publicly accessible.
    # ============================================================

    - /bin/mkdir -p $BACKEND_DIR/dist

    - /bin/cp -R backend/dist/. $BACKEND_DIR/dist/

    - /bin/cp backend/package.json $BACKEND_DIR/

    - /bin/cp backend/package-lock.json $BACKEND_DIR/


    # ============================================================
    # 5. Install backend production dependencies
    #
    # Do NOT copy node_modules from local machine.
    # Install production dependencies on the server.
    # ============================================================

    - /usr/local/bin/npm ci --prefix $BACKEND_DIR --omit=dev --no-audit --no-fund


    # ============================================================
    # 6. Protect backend environment
    #
    # IMPORTANT:
    # backend/.env is NOT deployed by Git.
    # Production secrets must be configured through cPanel
    # Node.js Application environment variables.
    # ============================================================

    - /bin/chmod 750 $BACKEND_DIR