---
deployment:
  tasks:

    # ==========================================
    # 1. Deployment directories
    # ==========================================

    - export PUBLIC_HTML=/home/$USER/public_html
    - export BACKEND_DIR=/home/$USER/backend_app


    # ==========================================
    # 2. Create directories
    # ==========================================

    - /bin/mkdir -p $PUBLIC_HTML
    - /bin/mkdir -p $BACKEND_DIR


    # ==========================================
    # 3. Deploy frontend
    # ==========================================

    - /bin/cp -R dist/. $PUBLIC_HTML/


    # ==========================================
    # 4. Copy backend source
    # ==========================================

    - /bin/cp -R backend/. $BACKEND_DIR/


    # ==========================================
    # 5. Install ALL backend dependencies
    #    Required for TypeScript build
    # ==========================================

    - /usr/local/bin/npm install --prefix $BACKEND_DIR --no-audit --no-fund


    # ==========================================
    # 6. Build TypeScript backend
    #
    # src/server.ts
    #        ↓
    # dist/server.js
    # ==========================================

    - /usr/local/bin/npm run build --prefix $BACKEND_DIR


    # ==========================================
    # 7. Remove development dependencies
    #    After successful build
    # ==========================================

    - /usr/local/bin/npm install --prefix $BACKEND_DIR --omit=dev --no-audit --no-fund